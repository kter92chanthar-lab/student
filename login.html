<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ລະບົບໂຮງຮຽນ</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 16px; }
  #google-login-btn { display: flex; justify-content: center; margin: 20px 0; }
  input, select, button { width: 100%; padding: 10px; margin: 6px 0; font-size: 16px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
  button { background: #2563eb; color: white; border: none; cursor: pointer; }
  button:disabled { background: #94a3b8; }
  #requestForm, #dashboard { display: none; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 14px; }
  th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
  th { background: #f1f5f9; }
  .month-btn { display: inline-block; width: auto; padding: 6px 14px; margin: 4px; background: #eef2ff; color: #1e293b; border: 1px solid #c7d2fe; }
  .month-btn.active { background: #2563eb; color: white; }
  #welcomeMsg { color: #16a34a; font-weight: bold; }
  #loadingMsg { color: #64748b; }
</style>
</head>
<body>

<h2>🏫 ລະບົບໂຮງຮຽນ</h2>

<div id="loginSection">
  <p>ກະລຸນາ Login ດ້ວຍ Google</p>
  <div id="google-login-btn"></div>
</div>

<div id="requestForm">
  <p>ຍັງບໍ່ເຄີຍລົງທະບຽນ — ຂໍສິດເຂົ້າລະບົບ:</p>
  <input id="roomInput" placeholder="ຫ້ອງ (ເຊັ່ນ ມ.4)">
  <button onclick="doRequest()">ສົ່ງຄຳຂໍ</button>
</div>

<div id="dashboard">
  <p id="welcomeMsg"></p>
  <div id="monthButtons"></div>
  <div id="loadingMsg"></div>
  <div id="scoreTableWrap"></div>
</div>

<script src="auth.js"></script>
<script>
  window.onload = () => initGoogleLogin('google-login-btn');

  function onLoginSuccess(access) {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('welcomeMsg').textContent =
      `ຍິນດີຕ້ອນຮັບ! ສິດ: ${access.role} | ຫ້ອງ: ${access.role === 'Admin' ? 'ທຸກຫ້ອງ' : access.room}`;

    // Admin: ຍັງບໍ່ມີ selector ຫ້ອງ ໃນຮອບນີ້ — ໃຊ້ຫ້ອງດຽວກັນກັບ Teacher/Student ກ່ອນ
    // (Admin ຄວນເລືອກຫ້ອງໄດ້ ຈະເພີ່ມພາຍຫຼັງ)
    const room = access.role === 'Admin' ? 'ມ.4' : access.room;
    loadMonths(room);
  }

  function showRequestAccessForm() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('requestForm').style.display = 'block';
  }

  function doRequest() {
    const room = document.getElementById('roomInput').value.trim();
    if (!room) { alert('ກະລຸນາໃສ່ຫ້ອງ'); return; }
    submitAccessRequest(room);
  }

  let activeRoom = '';

  async function loadMonths(room) {
    activeRoom = room;
    document.getElementById('loadingMsg').textContent = 'ກຳລັງໂຫລດລາຍການເດືອນ...';
    const res = await fetchMonths(room);
    document.getElementById('loadingMsg').textContent = '';

    if (res.error) {
      document.getElementById('monthButtons').textContent = '❌ ' + res.error;
      return;
    }

    const container = document.getElementById('monthButtons');
    container.innerHTML = '';
    res.months.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'month-btn';
      btn.textContent = m;
      btn.onclick = () => loadScores(room, m, btn);
      container.appendChild(btn);
    });
  }

  async function loadScores(room, month, btnEl) {
    document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');

    document.getElementById('loadingMsg').textContent = 'ກຳລັງໂຫລດຄະແນນ...';
    document.getElementById('scoreTableWrap').innerHTML = '';

    const res = await fetchScores(room, month);
    document.getElementById('loadingMsg').textContent = '';

    if (res.error) {
      document.getElementById('scoreTableWrap').textContent = '❌ ' + res.error;
      return;
    }

    if (!res.data || res.data.length === 0) {
      document.getElementById('scoreTableWrap').textContent = 'ບໍ່ພົບຂໍ້ມູນ';
      return;
    }

    let html = '<table><thead><tr>';
    res.header.forEach(h => html += `<th>${h}</th>`);
    html += '</tr></thead><tbody>';
    res.data.forEach(row => {
      html += '<tr>';
      row.forEach(cell => html += `<td>${cell}</td>`);
      html += '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('scoreTableWrap').innerHTML = html;
  }
</script>
</body>
</html>
