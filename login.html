<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ເຂົ້າສູ່ລະບົບ</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: sans-serif; max-width: 400px; margin: 60px auto; padding: 20px; text-align: center; }
  #google-login-btn { display: flex; justify-content: center; margin: 20px 0; }
  input, button { width: 100%; padding: 10px; margin: 6px 0; font-size: 16px; box-sizing: border-box; }
  button { background: #2563eb; color: white; border: none; border-radius: 6px; }
  #requestForm { display: none; margin-top: 20px; text-align: left; }
  #status { margin-top: 20px; color: #555; }
</style>
</head>
<body>
  <h2>🏫 ລະບົບໂຮງຮຽນ</h2>
  <p>ກະລຸນາ Login ດ້ວຍ Google</p>
  <div id="google-login-btn"></div>

  <div id="requestForm">
    <p>ຍັງບໍ່ເຄີຍລົງທະບຽນ — ຂໍສິດເຂົ້າລະບົບ:</p>
    <input id="roomInput" placeholder="ຫ້ອງ (ເຊັ່ນ ມ.4)">
    <button onclick="doRequest()">ສົ່ງຄຳຂໍ</button>
  </div>

  <div id="status"></div>

<script src="js/auth.js"></script>
<script>
  window.onload = () => initGoogleLogin('google-login-btn');

  // override ຟັງຊັນຈາກ auth.js ໃຫ້ໃຊ້ໃນໜ້ານີ້ໂດຍກົງ
  function onLoginSuccess(access) {
    document.getElementById('status').textContent =
      `ຍິນດີຕ້ອນຮັບ! ສິດ: ${access.role} ຫ້ອງ: ${access.room || 'ທຸກຫ້ອງ'}`;
  }

  function showRequestAccessForm() {
    document.getElementById('requestForm').style.display = 'block';
  }

  function doRequest() {
    const room = document.getElementById('roomInput').value.trim();
    if (!room) { alert('ກະລຸນາໃສ່ຫ້ອງ'); return; }
    submitAccessRequest(room);
  }
</script>
</body>
</html>
